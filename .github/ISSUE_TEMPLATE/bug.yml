name: Skill bug
about: Report incorrect, unsafe, or unusable skill behavior
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private client data, or confidential prompts and outputs.
  - type: input
    id: skill
    attributes:
      label: Skill
      placeholder: competitor-discovery
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and why it is incorrect or unusable.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: AI agent or host
      options:
        - Claude Code
        - Codex
        - Cursor
        - OpenCode
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction steps
      description: Use fictional or public examples only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal information, client data, and confidential material.
          required: true
